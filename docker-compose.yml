services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: referral
      MYSQL_USER: referral
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u referral -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      NODE_ENV: development # local demo stack; demo-user seeding is refused when this is "production"
      DB_HOST: db
      DB_USER: referral
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: referral
      DB_SYNCHRONIZE: "true" # local convenience; use migrations in a real deployment
      CORS_ORIGINS: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (min 32 chars)}
      COOKIE_SECURE: "false" # served over http on localhost; set true behind HTTPS
      TRUST_PROXY_HOPS: "1" # nginx in the frontend container
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db-data:
